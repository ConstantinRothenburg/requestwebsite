[build]
  publish = "src"
  command = ""

# Netlify Visual Editor Plugin (commented out for local dev)
# [[plugins]]
#   package = "@netlify/plugin-visual-editor"

[dev]
  command = "python3 -m http.server 5501 --directory src"
  port = 9999
  targetPort = 5501
  publish = "src"
  autoLaunch = false

[functions]
  directory = "netlify/functions"

# Root and preview redirects
[[redirects]]
  from = "/"
  to = "/pages/index.html"
  status = 200

[[redirects]]
  from = "/preview-server-status/*"
  to = "/pages/index.html"
  status = 200

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Asset caching - 1 year immutable
[[headers]]
  for = "*.css"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
    content-type = "text/css; charset=utf-8"

[[headers]]
  for = "*.js"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
    content-type = "text/javascript; charset=utf-8"

[[headers]]
  for = "*.jpg *.jpeg *.png *.webp *.avif *.svg *.gif *.ico"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff *.woff2 *.ttf *.otf *.eot"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.mp4 *.webm *.ogg"
  [headers.values]
    cache-control = "public, max-age=86400"

# HTML - browser cache only
[[headers]]
  for = "*.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
    x-ua-compatible = "IE=edge"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    x-frame-options = "DENY"
    x-xss-protection = "1; mode=block"
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
    permissions-policy = "geolocation=(), microphone=(), camera=()"
    strict-transport-security = "max-age=31536000; includeSubDomains; preload"
    content-security-policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.netlify.com https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.netlify.com https://api.netlify.com; frame-src 'self' https://app.netlify.com; frame-ancestors 'self' https://app.netlify.com https://create.netlify.com;"

# Netlify Forms
[[headers]]
  for = "form"
  [headers.values]
    x-frame-options = "DENY"

# Preload critical resources
[[headers]]
  for = "/index.html"
  [headers.values]
    link = "</css/index.css>; rel=preload; as=style, </js/lazy-load.js>; rel=preload; as=script"

# Netlify Visual Editor Configuration
[context.production.environment]
  NETLIFY_VISUAL_EDITOR = "true"
  VISUAL_EDITOR_MODE = "enabled"
  STACKBIT_ENABLE = "true"

[context.deploy-preview.environment]
  NETLIFY_VISUAL_EDITOR = "true"
  VISUAL_EDITOR_MODE = "enabled"
  STACKBIT_ENABLE = "true"

[context.branch-deploy.environment]
  NETLIFY_VISUAL_EDITOR = "true"
  VISUAL_EDITOR_MODE = "enabled"
  STACKBIT_ENABLE = "true"

# Visual Editor API endpoint
[[redirects]]
  from = "/api/netlify-visual/*"
  to = "/.netlify/functions/visual-editor/:splat"
  status = 200

