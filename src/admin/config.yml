# Decap CMS Configuration for Request Climate Action Platform
# Access at: /admin/

backend:
  name: git-gateway
  branch: main # Production branch
  # For local development, use:
  # name: test-repo

# Publish mode options: simple (no workflow), editorial_workflow (draft/review/ready)
publish_mode: editorial_workflow

# Media library configuration
media_folder: "src/assets/images/uploads" # Where uploaded files are saved
public_folder: "/assets/images/uploads" # Public URL path

# Media library settings
media_library:
  name: uploadcare
  config:
    publicKey: YOUR_UPLOADCARE_KEY # Free tier available
    multiple: false
    tabs: 'file url'
    effects: 'crop, rotate, enhance, grayscale'
    imageShrink: '2000x2000'
    previewStep: true

# Site URL for preview
site_url: https://request-climate.com
local_backend: true # Enable local development mode

# Collections define the content structure
collections:
  # Homepage content
  - name: "pages"
    label: "Pages"
    files:
      - label: "Homepage"
        name: "homepage"
        file: "src/pages/index.html"
        fields:
          # Hero Section
          - {label: "Title", name: "title", widget: "hidden", default: "Home"}
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "text", required: true, hint: "Main subtitle below hero headline"}
              - label: "Call to Actions"
                name: "ctas"
                widget: "list"
                fields:
                  - {label: "Button Text", name: "text", widget: "string"}
                  - {label: "Button URL", name: "url", widget: "string"}
                  - {label: "Style", name: "style", widget: "select", options: ["primary", "secondary", "outline"]}
          
          # Section 1: Deep Dive
          - label: "Section 1: Deep Dive"
            name: "section1"
            widget: "object"
            fields:
              - {label: "Headline", name: "headline", widget: "string", required: true}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Background Video", name: "background_video", widget: "file", required: false, hint: "MP4 or WebM format"}
              - {label: "Video Poster Image", name: "poster", widget: "image", required: false, hint: "Cover image before video plays"}
          
          # Section 2: Global Innovations
          - label: "Section 2: Global Innovations"
            name: "section2"
            widget: "object"
            fields:
              - {label: "Headline", name: "headline", widget: "string", required: true}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Background Video", name: "background_video", widget: "file", required: false}
              - {label: "Video Poster Image", name: "poster", widget: "image", required: false}
          
          # Section 3: Network
          - label: "Section 3: Network"
            name: "section3"
            widget: "object"
            fields:
              - {label: "Headline", name: "headline", widget: "string", required: true}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Background Video", name: "background_video", widget: "file", required: false}
              - {label: "Video Poster Image", name: "poster", widget: "image", required: false}
          
          # Section 4: Register
          - label: "Section 4: Register"
            name: "section4"
            widget: "object"
            fields:
              - {label: "Headline", name: "headline", widget: "string", required: true}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Background Video", name: "background_video", widget: "file", required: false}
              - {label: "Video Poster Image", name: "poster", widget: "image", required: false}
          
          # Section 5: Join Movement
          - label: "Section 5: Join Movement"
            name: "section5"
            widget: "object"
            fields:
              - {label: "Headline", name: "headline", widget: "string", required: true}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Background Video", name: "background_video", widget: "file", required: false}
              - {label: "Video Poster Image", name: "poster", widget: "image", required: false}
          
          # Section 6: Save Planet
          - label: "Section 6: Save Planet"
            name: "section6"
            widget: "object"
            fields:
              - {label: "Headline", name: "headline", widget: "string", required: true}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Background Image", name: "background_image", widget: "image", required: false}
          
          # Section 7: Impact 2025
          - label: "Section 7: Impact 2025"
            name: "section7"
            widget: "object"
            fields:
              - {label: "Headline", name: "headline", widget: "string", required: true}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Background Color", name: "background_color", widget: "color", required: false, default: "#208380"}
          
          # Registration Form
          - label: "Registration Form"
            name: "form"
            widget: "object"
            fields:
              - {label: "Form Title", name: "title", widget: "string", required: true}
              - {label: "Form Description", name: "description", widget: "text", required: false}
              - {label: "Success Message", name: "success_message", widget: "text", default: "Thank you for registering!"}

  # Site Settings
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "config/site-config.yaml"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string"}
          - {label: "Site Description", name: "site_description", widget: "text"}
          - {label: "Site URL", name: "site_url", widget: "string"}
          - label: "SEO Settings"
            name: "seo"
            widget: "object"
            fields:
              - {label: "Meta Description", name: "meta_description", widget: "text"}
              - {label: "Keywords", name: "keywords", widget: "list"}
              - {label: "Social Image", name: "og_image", widget: "image"}
          - label: "Brand Colors"
            name: "colors"
            widget: "object"
            fields:
              - {label: "Primary Color", name: "primary", widget: "color", default: "#208380"}
              - {label: "Secondary Color", name: "secondary", widget: "color", default: "#5E5240"}
              - {label: "Accent Color", name: "accent", widget: "color", default: "#ff005a"}
              - {label: "Background", name: "background", widget: "color", default: "#FCFCF9"}
              - {label: "Text Color", name: "text", widget: "color", default: "#1F2121"}

# Editor preview settings
show_preview_links: true
slug:
  encoding: "ascii"
  clean_accents: true
